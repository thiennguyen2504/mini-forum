worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate limiting: 10 requests / second, lưu trữ trong zone 10MB
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstreams cho 2 internal services
    upstream forum_backend {
        server forum-service:8000;
    }

    upstream notification_backend {
        server notification-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Health check của Gateway ──────────────────────────────────────
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }

        # ── Route 1: Forum Service ────────────────────────────────────────
        # STRIP prefix /api/ khi chuyển tiếp sang forum-service:8000
        # Ví dụ:
        #   GET  /api/posts        -> forum-service:8000/posts
        #   POST /api/auth/token   -> forum-service:8000/auth/token
        #   GET  /api/health       -> forum-service:8000/health
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://forum_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect /api -> /api/
        location = /api {
            return 301 /api/;
        }

        # ── Route 2: Notification Service ────────────────────────────────
        # GIỮ prefix /notifications/ khi chuyển tiếp sang notification-service:8000
        # Ví dụ:
        #   GET /notifications/1      -> notification-service:8000/notifications/1
        #   GET /notifications/health -> notification-service:8000/notifications/health
        location /notifications/ {
            proxy_pass http://notification_backend/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
